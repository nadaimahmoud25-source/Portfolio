<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case study: Awaed Options Trading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
#pg-nav{position:relative;z-index:50;transition:padding .25s ease,box-shadow .25s ease;will-change:transform}
#pg-nav[data-pinned="1"]{padding:14px 0 !important;background:rgba(255,255,255,.94);box-shadow:0 0 0 100vmax rgba(255,255,255,.94),0 1px 0 100vmax #E6E6E3;clip-path:inset(0 -100vmax -1px -100vmax);-webkit-backdrop-filter:saturate(1.4) blur(10px);backdrop-filter:saturate(1.4) blur(10px)}
.ttl{width:fit-content}
@media (max-width: 699px){.cs-herotile{aspect-ratio:4 / 5 !important;border-radius:20px !important}.cs-herotile > div{left:5% !important;right:5% !important;top:7% !important}}
a{color:#0E0F11}a:hover{color:#2643E9}
@keyframes csUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.cs-up{animation:csUp .8s cubic-bezier(.2,.7,.2,1) both}
.cs-d1{animation-delay:.1s}.cs-d2{animation-delay:.2s}
.cs-toc{transition:color .2s ease,border-color .2s ease}
@media (max-width: 899px){.cs-aside{display:none !important}}.cs-toc:hover{color:#0E0F11}
.cs-next .cs-shot{transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.cs-next:hover .cs-shot{transform:translateY(-8px)}
.cs-rv{opacity:0;transform:translateY(28px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.cs-rv.in{opacity:1;transform:none}
.cs-fade{transition:opacity .8s ease}
.cs-seg{transition:background-color .3s ease,color .3s ease,box-shadow .3s ease}
.cs-seg:focus-visible{outline:2px solid #5B4FD6;outline-offset:2px}
@keyframes csRise{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
.cs-rise{animation:csRise 1.2s .25s cubic-bezier(.2,.7,.2,1) both}
@keyframes csFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.cs-float{animation:csFloat 7s ease-in-out infinite}
.cs-float2{animation:csFloat 7s 1.2s ease-in-out infinite}
.cs-float3{animation:csFloat 7s 2.4s ease-in-out infinite}
@keyframes csBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.cs-bar{transform-origin:0 50%;animation:csBar 4.2s linear both}
@keyframes csBar2{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (max-width: 699px){.cs-steps{grid-template-columns:repeat(5,minmax(0,1fr)) !important}.cs-steps .cs-steplabel{display:none}}
@media (prefers-reduced-motion: reduce){.cs-up,.cs-rise,.cs-float,.cs-float2,.cs-float3,.cs-bar{animation:none}.cs-next .cs-shot,.cs-rv,.cs-fade,.cs-seg{transition:none}.cs-rv{opacity:1;transform:none}}
</style>
<style id="site-fixes">
#pg-nav{position:sticky !important;top:0;transform:none !important;will-change:auto}
#cs-toc-nav{transform:none !important}
@media (min-width: 900px){.cs-aside{position:sticky;top:96px}}
.xrow{border-radius:0 !important}
.xrow,.xrow:hover{padding-left:0 !important;padding-right:0 !important}
.xrow:hover{box-shadow:-12px 0 0 #F7F7F5,12px 0 0 #F7F7F5}
.xrow > *{transition:translate .3s cubic-bezier(.2,.7,.2,1)}
.xrow:hover > *{translate:4px 0}
@media (prefers-reduced-motion: reduce){.xrow > *{transition:none}.xrow:hover > *{translate:none}}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">

<div id="pg-root" style="position: relative; background: #FFFFFF; color: #0E0F11; font-family: Inter, system-ui, sans-serif; min-height: 100vh">
<div aria-hidden="true" style="position: absolute; top: 0; left: 0; width: 1px; height: 100%; pointer-events: none"><sc-for list="{{ pmarks }}" as="m" hint-placeholder-count="0"><span data-p="{{ m.i }}" style="{{ m.style }}"></span></sc-for></div>
<div style="max-width: 1280px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 64px); box-sizing: border-box">

<header id="pg-nav" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px 32px; padding: 28px 0">
<a href="index.html" style="display: flex; align-items: baseline; gap: 12px; text-decoration: none; color: #0E0F11"><span style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 500; letter-spacing: -0.02em">Nada Ibrahim</span><span style="font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #6B6F76">Senior Product Designer</span></a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 28px">
<a class="cs-toc" href="index.html" style="font-size: 15px; color: #6B6F76; text-decoration: none">← All work</a>
<a class="cs-toc" href="index.html" style="font-size: 15px; color: #6B6F76; text-decoration: none">About</a>
<a class="cs-toc" href="#" style="font-size: 15px; color: #6B6F76; text-decoration: none">Résumé</a>
<a href="#contact" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 999px; background: #F4F4F1; color: #0E0F11; font-size: 15px; font-weight: 500; text-decoration: none; box-sizing: border-box">Get in touch</a>
</nav>
</header>

<section style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 24px; padding: clamp(56px, 7vw, 104px) 0 clamp(40px, 5vw, 64px)">
<p class="cs-up" style="margin: 0; font-size: 13px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #6B6F76">Case study · Awaed · Options trading</p>
<h1 class="cs-up cs-d1" style="margin: 0; max-width: 900px; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: clamp(30px, 3.3vw, 46px); line-height: 1.12; font-weight: 500; letter-spacing: -0.025em">Awaed Options Trading</h1>
<p class="cs-up cs-d2" style="margin: 0; max-width: 640px; font-size: clamp(16px, 1.25vw, 18px); line-height: 1.55; color: #4A4D52">A proof of concept in one day and the full experience in one week. Options trading for retail investors, where the objective decided the design.</p>
<p class="cs-up cs-d2" style="margin: 0; font-size: 14px; color: #6B6F76">0 to 1 ∙ Web + mobile ∙ Validated with a prototype ∙ In beta</p>
</section>

<div class="cs-herotile" style="position: relative; aspect-ratio: 16 / 9; border-radius: 24px; background: #E3E1F5; overflow: hidden">
<div class="cs-rise" style="position: absolute; left: 8%; right: 8%; top: 10%; bottom: -4%; border-radius: 14px 14px 0 0; background: #FFFFFF; box-shadow: 0 30px 80px rgba(40, 30, 90, 0.2); display: flex; flex-direction: column; overflow: hidden">
<div style="height: 40px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 16px; border-bottom: 1px solid #EFEEEA"><span style="width: 9px; height: 9px; border-radius: 999px; background: #E4E2DC"></span><span style="width: 9px; height: 9px; border-radius: 999px; background: #E4E2DC"></span><span style="width: 9px; height: 9px; border-radius: 999px; background: #E4E2DC"></span></div>
<div style="flex: 1; min-height: 0; background: #000000"><img src="assets/57257e292df3d642d136cbfd41e182e3.webp" alt="Buying a TSLA call option: the option chain with the 447.50 call selected, and the order ticket showing contracts, limit price and an estimated gain and loss chart" style="display: block; width: 100%; height: 100%; object-fit: cover; object-position: top center"></div>
</div>
</div>

<dl style="display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 0; margin: 40px 0 0; border-top: 1px solid #E6E6E3">
<div style="padding: 20px 20px 20px 0; border-bottom: 1px solid #E6E6E3"><dt style="font-size: 13px; color: #6B6F76">My role</dt><dd style="margin: 6px 0 0; font-size: 15px; font-weight: 500">Lead Designer</dd></div>
<div style="padding: 20px 20px 20px 0; border-bottom: 1px solid #E6E6E3"><dt style="font-size: 13px; color: #6B6F76">Team</dt><dd style="margin: 6px 0 0; font-size: 15px; font-weight: 500">PM</dd></div>
<div style="padding: 20px 20px 20px 0; border-bottom: 1px solid #E6E6E3"><dt style="font-size: 13px; color: #6B6F76">Timeline</dt><dd style="margin: 6px 0 0; font-size: 15px; font-weight: 500">1-day POC · 1 week to full experience</dd></div>
<div style="padding: 20px 20px 20px 0; border-bottom: 1px solid #E6E6E3"><dt style="font-size: 13px; color: #6B6F76">Platform</dt><dd style="margin: 6px 0 0; font-size: 15px; font-weight: 500">Trading on web &amp; Mobile</dd></div>
<div style="padding: 20px 20px 20px 0; border-bottom: 1px solid #E6E6E3"><dt style="font-size: 13px; color: #6B6F76">Status</dt><dd style="margin: 6px 0 0; font-size: 15px; font-weight: 500">In beta</dd></div>

</dl>

<section style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; padding: clamp(48px, 6vw, 80px) 0">
<div style="padding: 28px; border-radius: 20px; background: #F4F4F1; display: flex; flex-direction: column; gap: 10px"><p style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #6B6F76">Problem</p><p style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 20px; line-height: 1.3; font-weight: 500; letter-spacing: -0.01em">Options are complex and can expire worthless. Awaed needed them to make sense for retail investors, not only for pros.</p></div>
<div style="padding: 28px; border-radius: 20px; background: #F4F4F1; display: flex; flex-direction: column; gap: 10px"><p style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #6B6F76">What I did</p><p style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 20px; line-height: 1.3; font-weight: 500; letter-spacing: -0.01em">Prototyped two directions in a day, let the retail objective decide, then designed the full experience in a week.</p></div>
<div style="padding: 28px; border-radius: 20px; background: #E9EDFD; display: flex; flex-direction: column; gap: 10px"><p style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #2643E9">Result</p><p style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 20px; line-height: 1.3; font-weight: 500; letter-spacing: -0.01em">Business confirmed the direction, and every rule in the PRD had a designed state, from eligibility to exercise.</p></div>
</section>

<div id="cs-body" style="position: relative; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 40px 64px; padding-bottom: clamp(72px, 9vw, 128px); border-top: 1px solid #E6E6E3; padding-top: clamp(48px, 6vw, 80px); justify-content: center">
<div aria-hidden="true" style="position: absolute; top: 0; left: 0; width: 1px; height: 100%; pointer-events: none"><sc-for list="{{ marks }}" as="m" hint-placeholder-count="0"><span data-i="{{ m.i }}" style="{{ m.style }}"></span></sc-for></div>

<div style="flex: 999 1 600px; min-width: 0; display: flex; flex-direction: column; gap: clamp(120px, 12vw, 184px)">

<section id="context" style="display: flex; flex-direction: column; gap: 20px; max-width: 680px">
<p style="margin: 0; font-size: 13px; font-weight: 500; color: #6B6F76">01 · Context</p>
<h2 style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: clamp(26px, 2.4vw, 34px); line-height: 1.12; font-weight: 500; letter-spacing: -0.02em">Options for retail investors, on the Web Trader foundation</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.65; color: #4A4D52">Awaed added US options trading, and it had to move fast. The audience was retail investors, many of them new to options. I designed it for both Awaed Web, built on the Web Trader system, and the mobile app. As the lead and only designer, I owned the experience end to end, working closely with the PM.</p>
</section>

<section id="challenge" style="display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; flex-direction: column; gap: 20px; max-width: 680px">
<p style="margin: 0; font-size: 13px; font-weight: 500; color: #6B6F76">02 · The challenge</p>
<h2 style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: clamp(26px, 2.4vw, 34px); line-height: 1.12; font-weight: 500; letter-spacing: -0.02em">A complex, high-risk product for first-time traders</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.65; color: #4A4D52">Options can expire worthless, and many of our users had never traded them. The experience had to make the risk clear without scaring people away, while following Shariah rules and Awaed’s own trading rules.</p>
</div>
<figure class="{{ rv.journey }}" data-rv="journey" onMouseEnter="{{ hovJIn }}" onMouseLeave="{{ hovJOut }}" style="margin: 0; display: flex; flex-direction: column; gap: 12px">
<div style="border-radius: 20px; background: #F4F4F1; padding: clamp(16px, 2.4vw, 32px); display: flex; flex-direction: column; gap: clamp(14px, 1.8vw, 22px)">
<div class="cs-steps" role="group" aria-label="Journey steps" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{ journeySteps }}" as="st" hint-placeholder-count="5">
<button class="cs-seg" type="button" onClick="{{ st.go }}" aria-pressed="{{ st.pressed }}" style="{{ st.style }}"><span style="{{ st.numStyle }}">{{ st.num }}</span><span class="cs-steplabel">{{ st.label }}</span></button>
</sc-for>
</div>
<div style="position: relative; aspect-ratio: 16 / 8; border-radius: 12px; overflow: hidden; background: #000000; box-shadow: 0 20px 50px rgba(40, 30, 90, 0.16)">
<sc-for list="{{ journeyShots }}" as="sh" hint-placeholder-count="5">
<img class="cs-fade" src="{{ sh.src }}" alt="{{ sh.alt }}" style="{{ sh.style }}">
</sc-for>
<span aria-hidden="true" style="{{ journeyBar }}"></span>
</div>
</div>
<figcaption style="font-size: 13px; color: #6B6F76">The options journey, from the eligibility check to exercising a contract. Steps play in order. Hover to pause, or pick a step to jump to it.</figcaption>
</figure>
</section>

<section id="decisions" style="display: flex; flex-direction: column; gap: clamp(88px, 9vw, 128px)">
<div style="display: flex; flex-direction: column; gap: 20px; max-width: 680px">
<p style="margin: 0; font-size: 13px; font-weight: 500; color: #6B6F76">03 · Key decisions</p>
<h2 style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: clamp(26px, 2.4vw, 34px); line-height: 1.12; font-weight: 500; letter-spacing: -0.02em">Letting the objective decide</h2>
</div>

<div style="display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 8px; max-width: 680px; padding-left: 16px; border-left: 2px solid #2643E9">
<p style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #2643E9">Decision 01</p>
<h3 style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 22px; line-height: 1.25; font-weight: 500; letter-spacing: -0.01em">It starts with who gets in</h3>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #4A4D52">Eligibility is the first thing a user meets, so the experience starts there: a short questionnaire on market direction, risk, a knowledge check and risk tolerance, ending in a clear eligibility result. Once the business confirmed the direction, I designed the full experience in one week, section by section, and worked through the PRD so every rule and edge case had a designed state.</p>
</div>
<figure class="{{ rv.onb }}" data-rv="onb" onMouseEnter="{{ hovOIn }}" onMouseLeave="{{ hovOOut }}" style="margin: 0; display: flex; flex-direction: column; gap: 12px">
<div style="border-radius: 20px; background: #F4F4F1; padding: clamp(16px, 2.4vw, 32px); display: flex; flex-direction: column; gap: clamp(14px, 1.8vw, 22px)">
<div class="cs-steps" role="group" aria-label="Onboarding steps" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{ onbSteps }}" as="st" hint-placeholder-count="5">
<button class="cs-seg" type="button" onClick="{{ st.go }}" aria-pressed="{{ st.pressed }}" style="{{ st.style }}"><span style="{{ st.numStyle }}">{{ st.num }}</span><span class="cs-steplabel">{{ st.label }}</span></button>
</sc-for>
</div>
<div style="position: relative; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #000000; box-shadow: 0 20px 50px rgba(40, 30, 90, 0.16)">
<sc-for list="{{ onbShots }}" as="sh" hint-placeholder-count="5">
<img class="cs-fade" src="{{ sh.src }}" alt="{{ sh.alt }}" style="{{ sh.style }}">
</sc-for>
<span aria-hidden="true" style="{{ onbBar }}"></span>
</div>
</div>
<figcaption style="font-size: 13px; color: #6B6F76">Unlock Options Trading: direction, risk disclosure, knowledge check and risk tolerance, ending in an eligibility result.</figcaption>
</figure>
</div>

<div style="display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 8px; max-width: 680px; padding-left: 16px; border-left: 2px solid #2643E9">
<p style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #2643E9">Decision 02</p>
<h3 style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 22px; line-height: 1.25; font-weight: 500; letter-spacing: -0.01em">Two directions, tested in a one-day prototype</h3>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #4A4D52">Direction A showed one table at a time, calls or puts. Direction B put calls and puts side by side, the way professional platforms do. I built a prototype of both in a day, so the business could compare them in use instead of imagining them.</p>
</div>
<figure class="{{ rv.dirs }}" data-rv="dirs" onMouseEnter="{{ hovDIn }}" onMouseLeave="{{ hovDOut }}" style="margin: 0; display: flex; flex-direction: column; gap: 12px">
<div style="aspect-ratio: 16 / 10; border-radius: 20px; background: #E9EDFD; overflow: hidden; display: flex; flex-direction: column; padding: clamp(16px, 2.4vw, 32px) clamp(16px, 2.4vw, 32px) 0; box-sizing: border-box; gap: clamp(12px, 1.6vw, 20px)">
<div role="group" aria-label="Design direction" style="align-self: center; display: inline-flex; gap: 2px; padding: 4px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 4px 16px rgba(38, 67, 233, 0.08)">
<button class="cs-seg" type="button" onClick="{{ dirA }}" aria-pressed="{{ dirAPressed }}" style="{{ dirAStyle }}">A · One table</button>
<button class="cs-seg" type="button" onClick="{{ dirB }}" aria-pressed="{{ dirBPressed }}" style="{{ dirBStyle }}">B · Side by side</button>
</div>
<div style="position: relative; flex: 1; min-height: 0; width: 100%; max-width: 980px; align-self: center; border-radius: 12px 12px 0 0; overflow: hidden; background: #000000; box-shadow: 0 24px 60px rgba(38, 67, 233, 0.2)">
<img class="cs-fade" src="assets/fe3d7e6f3bf8a94e6f107c03276fb281.webp" alt="Direction A: a Calls and Puts toggle above a single option chain table, with expiry dates and the order panel on the right" style="{{ dirAImg }}">
<img class="cs-fade" src="assets/5cadec6e2f68c3d2ffdaea0ddd38a04d.webp" alt="Direction B: calls and puts side by side around the strike price column, like professional platforms" style="{{ dirBImg }}">
</div>
</div>
<figcaption style="font-size: 13px; color: #6B6F76">The two directions from the one-day prototype, on the same TSLA chain.</figcaption>
</figure>
</div>

<div style="display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 8px; max-width: 680px; padding-left: 16px; border-left: 2px solid #2643E9">
<p style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #2643E9">Decision 03</p>
<h3 style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 22px; line-height: 1.25; font-weight: 500; letter-spacing: -0.01em">One table, because we were designing for retail</h3>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #4A4D52">We were targeting retail users, so one table made more sense: it keeps the choice to a single question, do you expect the price to rise or fall? For more advanced traders, I added two things to the roadmap: a toggle to switch to the side-by-side view, and a strategy builder.</p>
</div>
<div class="{{ rv.calls }}" data-rv="calls" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px">
<figure style="margin: 0; display: flex; flex-direction: column; gap: 12px">
<div style="position: relative; aspect-ratio: 4 / 5; border-radius: 20px; background: #F4F4F1; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 8%; box-sizing: border-box">
<p style="position: absolute; top: 16px; left: 16px; margin: 0; display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: #FFFFFF; font-size: 12px; font-weight: 600; color: #0E0F11"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 999px; background: #1E9E52"></span>Calls</p>
<img class="cs-float" src="assets/813c8ddd4ea4906ef5591ef67905d92a.webp" alt="Onboarding step: where do you think AAPL is heading? Up is selected, highlighting Calls, profit if price rises" style="display: block; width: 100%; height: auto; border-radius: 12px; box-shadow: 0 24px 40px rgba(0, 0, 0, 0.22)">
</div>
<figcaption style="font-size: 13px; line-height: 1.5; color: #6B6F76">Calls · pick "Up" and the call payoff lights up: profit if the price rises.</figcaption>
</figure>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 12px">
<div style="position: relative; aspect-ratio: 4 / 5; border-radius: 20px; background: #F4F4F1; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 8%; box-sizing: border-box">
